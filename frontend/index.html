<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1><i class="fas fa-tasks"></i> Niraj Tasks</h1>

            <form id="todo-form" class="todo-form">
                <div class="form-group">
                    <input type="text" id="item-name" placeholder="Item Name" required>
                    <span class="focus-border"></span>
                </div>
                <div class="form-group">
                    <textarea id="item-desc" placeholder="Item Description" rows="3"></textarea>
                    <span class="focus-border"></span>
                </div>
                <div class="form-group">
                    <input type="text" id="item-id" placeholder="Item ID">
                    <span class="focus-border"></span>
                </div>
                <div class="form-group">
                    <input type="text" id="item-uuid" placeholder="Item UUID">
                    <span class="focus-border"></span>
                </div>
                <div class="form-group">
                    <input type="text" id="item-hash" placeholder="Item Hash">
                    <span class="focus-border"></span>
                </div>
                <button type="submit" class="add-btn">
                    <span>Submit</span>
                    <i class="fas fa-plus"></i>
                </button>
            </form>

            <div id="status" class="status" aria-live="polite"></div>

            <div class="todo-list" id="todo-list">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
